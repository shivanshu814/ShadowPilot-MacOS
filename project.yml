name: ShadowPilot
options:
  bundleIdPrefix: com.shadowpilot
  deploymentTarget:
    macOS: "13.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  ShadowPilot:
    type: application
    platform: macOS
    sources:
      - path: ShadowPilot
        excludes:
          - "**/*.entitlements"
          - "**/*.png"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shadowpilot.app
        INFOPLIST_FILE: ShadowPilot/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShadowPilot/ShadowPilot.entitlements
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - framework: ScreenCaptureKit.framework
        embed: false
      - framework: Speech.framework
        embed: false
      - framework: AVFoundation.framework
        embed: false
