name: WABusiness
options:
  bundleIdPrefix: com.wabusiness
  deploymentTarget:
    macOS: "13.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  WABusiness:
    type: application
    platform: macOS
    sources:
      - path: WABusiness
        excludes:
          - "**/*.entitlements"
          - "**/*.png"
    settings:
      base:
        PRODUCT_NAME: "WA Business"
        PRODUCT_BUNDLE_IDENTIFIER: com.wabusiness.app
        INFOPLIST_FILE: WABusiness/Info.plist
        CODE_SIGN_ENTITLEMENTS: WABusiness/WABusiness.entitlements
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - framework: ScreenCaptureKit.framework
        embed: false
      - framework: Speech.framework
        embed: false
      - framework: AVFoundation.framework
        embed: false
